name: Deploy to Tophost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH + lftp
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            REPO_DIR="/opt/farezero-website"
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/f4rezer0/website.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch origin
            git reset --hard origin/main
            lftp -c "
              set ssl:verify-certificate no
              set ftp:ssl-force true
              set ftp:ssl-protect-data true
              open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }}
              cd /htdocs
              mirror --reverse --delete --exclude .git/ --exclude .github/ --exclude node_modules/ --verbose . .
              quit
            "
            echo "Deploy complete."
