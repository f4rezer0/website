name: Deploy to Tophost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/opt/farezero-website"
          overwrite: true
          rm: true

      - name: Deploy via lftp
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/farezero-website
            lftp -c "
              set ssl:verify-certificate no
              set ftp:ssl-force true
              set ftp:ssl-protect-data true
              open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }} ${{ secrets.FTP_HOST }}
              cd /htdocs
              mirror --reverse --delete --exclude .git/ --exclude .github/ --exclude node_modules/ --verbose . .
              quit
            "
            echo "Deploy complete."
